<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg)" rx="16" />
  <rect width="996" height="596" x="2" y="2" fill="none" stroke="#334155" stroke-width="2" rx="16" />

  <!-- Title -->
  <text x="500" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">
    MINE MINDS ROVER - END-TO-END SYSTEM TOPOLOGY
  </text>
  <text x="500" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Industrial AI Patrol, Dual-Layer Safety Analysis &amp; Telemetry Ingestion Architecture
  </text>

  <!-- Section 1: Embedded Hardware & Sensors -->
  <g transform="translate(40, 110)">
    <rect width="260" height="440" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="260" height="40" rx="12" fill="#0284c7" fill-opacity="0.2" />
    <text x="130" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">
      1. ROVER EDGE FIRMWARE
    </text>

    <!-- Node 1: Physical Sensors -->
    <rect x="20" y="55" width="220" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="130" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      Arduino Uno Telemetry Node
    </text>
    <text x="35" y="105" font-family="monospace" font-size="11" fill="#10b981">• MQ-2 (Methane CH4)</text>
    <text x="35" y="125" font-family="monospace" font-size="11" fill="#f59e0b">• MQ-7 (Carbon Monoxide)</text>
    <text x="35" y="145" font-family="monospace" font-size="11" fill="#38bdf8">• DHT11 (Temp &amp; Humidity)</text>
    <text x="35" y="165" font-family="monospace" font-size="11" fill="#ec4899">• SW-420 (Vibration / Roof)</text>
    <text x="35" y="185" font-family="monospace" font-size="11" fill="#6366f1">• Sub-floor Water Probe</text>

    <!-- Node 2: Mobility Subsystem -->
    <rect x="20" y="225" width="220" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="130" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      ESP32 Mobility Subsystem
    </text>
    <text x="35" y="275" font-family="monospace" font-size="11" fill="#cbd5e1">• L298N Dual Motor Driver</text>
    <text x="35" y="295" font-family="monospace" font-size="11" fill="#cbd5e1">• Bluetooth Serial Control</text>

    <!-- Node 3: Serial Gateway -->
    <rect x="20" y="340" width="220" height="80" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
    <text x="130" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#06b6d4" text-anchor="middle">
      Hardware Bridge (Python)
    </text>
    <text x="130" y="388" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
      Serial USB JSON Reader
    </text>
    <text x="130" y="406" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">
      POST /api/sensors/ingest
    </text>
  </g>

  <!-- Section 2: FastAPI Backend Core -->
  <g transform="translate(370, 110)">
    <rect width="260" height="440" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect width="260" height="40" rx="12" fill="#059669" fill-opacity="0.2" />
    <text x="130" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">
      2. FASTAPI BACKEND &amp; AI
    </text>

    <!-- Ingestion API -->
    <rect x="20" y="55" width="220" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="130" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      Ingestion REST Endpoint
    </text>

    <!-- Dual Layer Engine -->
    <rect x="20" y="120" width="220" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <text x="130" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">
      Dual-Layer Safety Engine
    </text>
    <rect x="30" y="160" width="200" height="42" rx="4" fill="#0f172a" />
    <text x="130" y="177" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">Layer 1: Deterministic Rules</text>
    <text x="130" y="193" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Immediate regulatory safety limits</text>
    <rect x="30" y="212" width="200" height="45" rx="4" fill="#0f172a" />
    <text x="130" y="229" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">Layer 2: Random Forest + XAI</text>
    <text x="130" y="245" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">21 rolling features &amp; risk score</text>

    <!-- Database -->
    <rect x="20" y="285" width="220" height="55" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="130" y="310" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      SQLAlchemy Database
    </text>
    <text x="130" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      Telemetry, Patrols, Alerts, Audit
    </text>

    <!-- WebSocket Broadcaster -->
    <rect x="20" y="355" width="220" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="130" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">
      WebSocket Broadcaster
    </text>
    <text x="130" y="402" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">
      /ws/live (2Hz stream)
    </text>
  </g>

  <!-- Section 3: React Dashboard UI -->
  <g transform="translate(700, 110)">
    <rect width="260" height="440" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
    <rect width="260" height="40" rx="12" fill="#4f46e5" fill-opacity="0.2" />
    <text x="130" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#818cf8" text-anchor="middle">
      3. MISSION CONTROL UI
    </text>

    <!-- Components -->
    <rect x="20" y="55" width="220" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="130" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      Interactive Digital Mine Map
    </text>
    <text x="130" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      Live SVG tunnel sectors &amp; rover
    </text>
    <text x="130" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      Real-time position animation
    </text>

    <rect x="20" y="145" width="220" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="130" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      Telemetry Visualizer
    </text>
    <text x="130" y="192" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      Sparklines, gauges, sensor charts
    </text>

    <rect x="20" y="225" width="220" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="130" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      Explainable AI Card
    </text>
    <text x="130" y="272" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      Perturbation factor rankings
    </text>

    <rect x="20" y="305" width="220" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
    <text x="130" y="330" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">
      Emergency Siren &amp; Alerting
    </text>
    <text x="130" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      Web Audio API synthesizer
    </text>

    <rect x="20" y="380" width="220" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="130" y="405" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      Demo Scenario Bar
    </text>
    <text x="130" y="420" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      6 interactive simulated events
    </text>
  </g>

  <!-- Connectors -->
  <!-- Hardware to Backend -->
  <path d="M 300 490 L 370 490" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6,4" fill="none" />
  <polygon points="368,485 378,490 368,495" fill="#06b6d4" />

  <!-- Backend to Frontend -->
  <path d="M 630 495 L 700 495" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" fill="none" />
  <polygon points="698,490 708,495 698,500" fill="#10b981" />
</svg>
